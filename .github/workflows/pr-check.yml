name: Check

# Builds the solution and runs the tests for every pull request, so a contribution is checked before a maintainer reads it.
# It also runs on every push to main and by hand, so the maintainers' own changes, which go straight to main, are checked too.
# Release checks and the full blessing stay local (project convention); this is the one narrow exception, because a contributor's
# local run cannot be seen.
#
# Safe for outside contributions: it uses the pull_request trigger only (never pull_request_target), has no secrets, and its
# token is read-only. Actions are pinned to a commit hash; Dependabot keeps them current (.github/dependabot.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build
