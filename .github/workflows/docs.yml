name: Docs

# Builds the DocFX API reference and publishes it to GitHub Pages together with the browser REPL (at /repl/), so every
# example's "Open in REPL" link lands on the same site. Manual for now. The example test runs locally before a deploy:
#   dotnet test tests/Sigil.Sound.Repl.Tests --filter DocExampleTests
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build API docs
        working-directory: docs
        run: dotnet docfx docfx.json --warningsAsErrors

      - name: Publish the REPL
        run: dotnet publish apps/Sigil.Sound.Repl -c Release -o artifacts/repl-publish

      - name: Place the REPL under /repl/
        run: |
          cp -r artifacts/repl-publish/wwwroot docs/_site/repl
          # The REPL is served from /repl/, not from the site root.
          sed -i 's|<base href="/" />|<base href="/repl/" />|' docs/_site/repl/index.html
          grep -q '<base href="/repl/" />' docs/_site/repl/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
