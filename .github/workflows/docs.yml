name: Docs

# Builds the DocFX API reference and the browser REPL (served at /repl/) and deploys them to Cloudflare as a Workers
# static-assets site (wrangler.jsonc). Only the latest docs are served, and every page footer names the version they
# describe. release.yml calls this after a successful NuGet push; it can also be dispatched alone to redeploy the docs.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (a token allowed to edit Workers).
# The custom domain is attached to the Worker in the Cloudflare dashboard.
#
# The example test runs locally before a deploy:
#   dotnet test tests/Sigil.Sound.Repl.Tests --filter DocExampleTests
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version named in the footer. Empty means VersionPrefix from Directory.Build.props.'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: docs-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Work out the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ -z "$version" ]]; then
            version=$(tr -d '\r' < Directory.Build.props | sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # One script builds the whole site (docs, REPL, headers, 404 page) and checks it against the Workers limits, so what is
      # checked locally with `bash scripts/build-site.sh` is what ships.
      - name: Build the site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-site.sh "$VERSION"

      - name: Install Wrangler
        run: npm install -g wrangler@4.150.0

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
