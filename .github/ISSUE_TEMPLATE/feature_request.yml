name: Feature request
description: A new operator, a new parameter, or something the library should do that it does not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        New operators and changes to the public API are decided here, before any code is written (see [CONTRIBUTING.md](https://github.com/sigilllc/SigilSound/blob/main/CONTRIBUTING.md)). A short request is fine.
  - type: textarea
    id: sound
    attributes:
      label: What do you want to make, and what gets in the way?
      description: The sound or the job, not the solution. "A pad that ducks under the kick" says more than "add a parameter".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The code you write now, if any, for example with Fn or a custom operator.
      render: csharp
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to write
      description: The line of code you wish worked. Every parameter should have a sensible default.
      render: csharp
